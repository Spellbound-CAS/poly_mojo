      - Writing documentation: contributing/documentation.md
      - Ground rules: spec/ground-rules.md
      - Implementation contracts: spec/index.md
      - Representation contracts: spec/p1-arithmetic.md
      - Division and elimination contracts: spec/p2-gcd.md
      - Factorization contracts: spec/p3-factorization.md
