# Builds and tests the conda package on a native Linux ARM64 runner, as
# modular-community's CI does: the project's recipe, built with the channel's
# rattler-build and channels, then the recipe's tests.
#
# Runs by hand. The default builds from the checkout; `source: tag` builds from
# the release tag the recipe names, which is what the channel builds:
#   gh workflow run package-arm.yml -R Spellbound-Mojo/polynomials --ref main -f source=tag
#
# The recipe's project source must be a `git:` entry followed by a `tag:` line.
# Don't write a literal ${{ version }} in a run block: GitHub evaluates ${{ }}
# anywhere in a workflow file.
name: Linux ARM64 package

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Build from this checkout or from the recipe's release tag"
        type: choice
        options: [checkout, tag]
        default: checkout

permissions:
  contents: read

jobs:
  package:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RECIPE: recipes/poly_mojo/recipe.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Select the recipe source
        env:
          SOURCE: ${{ inputs.source || 'checkout' }}
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p "$RUNNER_TEMP/recipe"
          python3 - "$SOURCE" "$RECIPE" "$RUNNER_TEMP/recipe/recipe.yaml" "$GITHUB_WORKSPACE" <<'EOF'
          import re, sys
          source, recipe, output, checkout = sys.argv[1:]
          text = open(recipe).read()
          if source == "checkout":
              text, count = re.subn(r"(?m)^([ \t]*)- git: \S+\n[ \t]+tag: .*\n",
                                    lambda m: f"{m[1]}- path: {checkout}\n{m[1]}  use_gitignore: true\n", text)
              assert count == 1, "the recipe must have exactly one git source with a tag"
          open(output, "w").write(text)
          EOF
          echo "Building from the $SOURCE"
      # The rattler-build range follows the pin in modular-community's pixi.toml.
      - name: Build and test the package
        run: >-
          pixi exec --spec "rattler-build>=0.30.0,<0.31" -- rattler-build build
          --recipe "$RUNNER_TEMP/recipe/recipe.yaml"
          -c conda-forge -c https://conda.modular.com/max -c https://prefix.dev/modular-community
          --output-dir "$RUNNER_TEMP/out"
